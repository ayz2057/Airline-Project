<html>
<head>
</head>
<body>
<form action="/StaffRegAuth" method="POST">
    <input type="text" name="username" placeholder="Username" maxlength="50" required><br>
    <input type="text" name="airline_name" placeholder="Airline name" maxlength="50" required><br>
    <input type="password" name="password" placeholder="Password" maxlength="50" required><br>
    <input type="text" name="first_name" placeholder="First name" maxlength="50" required><br>
    <input type="text" name="last_name" placeholder="Last name" maxlength="50" required><br>
    <label>Date of birth:
        <input type="date" name="dob" required>
    </label><br>
    <input type="email" name="email" placeholder="Email" maxlength="50" required><br>
    <input type="submit" value="Register">

    {% if error %}
        <p class="error"><strong>Error:</strong> {{ error }}</p>
    {% endif %}
</form>
<a href="/">Go back</a>
</body>
</html>
