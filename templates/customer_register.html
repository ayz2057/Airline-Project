<html>
<head>
</head>
<body>
<form action="/CustRegAuth" method="POST">
	<input type="text" name = "email" placeholder = "email" required/> </br>
	<input type="password" name = "password" placeholder = "password" required/></br>
	<input type="text" name = "name" placeholder="full name" required/></br>
	<input type="number" name = "building_num" placeholder="building number" required/></br>
	<input type="text" name = "street" placeholder = "street" required/></br>
	<input type="text" name = "city" placeholder = "city" required/></br>
	<input type="text" name = "state" placeholder = "state" required/></br>
    <input type="tel" name="phone_num" pattern="[0-9]{10}" placeholder = "phone number" required>   <label>
    <input type="text" name = "passport_num" placeholder="passport number" required/></br>
    <label>
        Passport Expiration Date:
        <input type="date" name="passport_exp" required> <!--select xx/01/yyyy automatically later -->
    </label>
    <input type="text" name = "passport_country" placeholder = "passport country" required/></br>
    <label>
        Date of Birth:
        <input type="date" name="dob" required>
    </label>
	<input type="submit" value = Register />
	{% if error %}
		<p class="error"><strong>Error:</strong> {{error}}</p>
	{% endif %}
</form>
<a href="/">Go back</a>
</body>
</html>
